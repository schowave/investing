# Werkzeuge und Abläufe für dieses Repo – eine Quelle für lokal und CI. Renovate hält die Versionen aktuell.
#   mise trust && mise run setup   # einmalig: Node, pnpm, lefthook, Pakete, Git-Hooks, Datenbank auf Stand
#   mise run check                 # alles, was vor einem Push grün sein muss (läuft genauso im CI und vor jedem Commit)
#   mise tasks                     # Überblick über alle Tasks
min_version = "2026.11.5"

[settings]
# mise.lock hält die exakten Versionen und Prüfsummen fest (für lokal und CI).
lockfile = true

[tools]
node = "26.13.1"
pnpm = "12.22.0"
lefthook = "2.2.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[env]
# Ein gesetztes INVESTING_DB gilt weiter (Tests gegen eine Kopie), sonst die lokale Datenbank.
INVESTING_DB = "{{ get_env(name='INVESTING_DB', default='data/investing.sqlite') }}"
# Proxmox-Host für die deploy:*-Tasks (Schlüssel und Adresse überschreibbar).
PVE_HOST = "root@192.168.1.110"
PVE_SSH_KEY = "{{env.HOME}}/.ssh/pve_ed25519"
INVESTING_CTID = "108"

# --- Workspace-Standard ---------------------------------------------------------

[tasks.setup]
description = "Frischer Klon -> lauffähig: Werkzeuge, Pakete, Git-Hooks, Datenbank auf den neuesten Stand"
run = ["mise install", "pnpm install --frozen-lockfile", "lefthook install", "mise run db:migrate"]

[tasks.check]
description = "Alles, was vor einem Push grün sein muss: Lint/Format, Typen, Tests mit Abdeckung, toter Code, Schema (läuft genauso im CI)"
depends = ["lint", "typecheck", "test:coverage", "knip", "db:check"]

[tasks.lint]
description = "Biome (Lint und Format, ohne zu ändern), actionlint für die Workflows, shellcheck für die Shell-Skripte"
run = ["pnpm exec biome ci .", "actionlint", "git ls-files -z '*.sh' | xargs -0 shellcheck"]

[tasks.fmt]
description = "Formatieren und sichere Lint-Korrekturen anwenden (Biome)"
run = "pnpm exec biome check --write ."

[tasks.typecheck]
description = "TypeScript-Typprüfung"
run = "pnpm run typecheck"

[tasks.test]
description = "Unit-Tests (vitest)"
run = "pnpm run test"

[tasks."test:coverage"]
description = "Unit-Tests mit Abdeckung; bricht unter den Schwellen in vitest.config.ts (Bericht: coverage/index.html)"
run = "pnpm exec vitest run --coverage"

[tasks."strategy:imprint"]
description = "Abdruck der Strategie (src/valuation/imprints) neu schreiben: bei neuer STRATEGY_VERSION oder bewusst ohne Wirkung"
run = "STRATEGY_IMPRINT=schreiben pnpm exec vitest run src/valuation/strategyImprint.test.ts"

[tasks.knip]
description = "Ungenutzte Dateien, Exporte und Abhängigkeiten (knip)"
run = "pnpm exec knip"

[tasks.build]
description = "Produktions-Build der Oberfläche (next build)"
run = "pnpm run build"

[tasks.dev]
description = "Oberfläche (http://localhost:3000) und Worker für die Läufe lokal starten, Datenbank vorher auf Stand bringen"
depends = ["db:migrate"]
# .env.local in der Shell laden: Werte wie "$(creds read …)" führen weder Next.js noch node --env-file aus. Was die Shell
# setzt, geht dem vor, was beide selbst aus der Datei lesen.
run = "set -a; [ -f .env.local ] && . ./.env.local; set +a; pnpm run worker & trap 'kill $!' EXIT; pnpm run dev"

[tasks.start]
description = "Gebaute Oberfläche starten (nach mise run build)"
depends = ["db:migrate"]
run = "pnpm run start"

# --- Datenbank (Drizzle) -------------------------------------------------------

[tasks."db:migrate"]
description = "Offene Migrationen auf data/investing.sqlite anwenden (passiert auch bei jedem Öffnen der Datenbank)"
run = "pnpm run migrate"

[tasks."db:generate"]
description = "Migration aus den Änderungen an src/data/schema.ts erzeugen: mise run db:generate <name>"
usage = 'arg "<name>" help="Kurzer Name in snake_case, z. B. notizen_zu_aktien"'
run = "pnpm exec drizzle-kit generate --name ${usage_name}"

[tasks."db:check"]
description = "Prüft, dass db/migrations zu src/data/schema.ts passt (keine Änderung ohne Migration)"
run = '''
set -e
pnpm exec drizzle-kit check >/dev/null
out="$(pnpm exec drizzle-kit generate --name schema_drift 2>&1)"
if printf '%s' "$out" | grep -q "No schema changes"; then exit 0; fi
rm -rf db/migrations/*_schema_drift
echo "src/data/schema.ts hat Änderungen ohne Migration: mise run db:generate <name>" >&2
exit 1
'''

[tasks."db:backup"]
description = "Sicherung nach data/backups (die letzten 7 bleiben; macht der nächtliche Abgleich auch selbst)"
run = "pnpm run backup"

[tasks."db:compact"]
description = "Rohantworten packen und die Datenbankdatei verkleinern"
run = "pnpm run compact"

[tasks."db:studio"]
description = "Drizzle Studio: Datenbank im Browser ansehen"
run = "pnpm exec drizzle-kit studio"

# --- Daten ---------------------------------------------------------------------

[tasks.sync]
description = "Täglicher Abgleich: Sicherung, Kurse, Wechselkurse, Bewertungen (liest .env.local)"
run = "pnpm run sync"

[tasks.evaluate]
description = "Rangliste der Watchlist ausgeben: mise run evaluate [Aktie]"
run = "pnpm run evaluate"

[tasks.schedule]
description = "Täglichen Abgleich als launchd-Dienst einrichten: mise run schedule an|aus|status"
usage = 'arg "<befehl>" help="an, aus oder status"'
run = "pnpm run schedule ${usage_befehl}"

# --- Worktrees -----------------------------------------------------------------

[tasks."worktree:init"]
description = "Im Worktree: .env.local und eine konsistente Kopie der Datenbank aus dem Haupt-Checkout holen (was .worktreeinclude für Claude Code tut)"
run = '''
set -e
main="$(git worktree list --porcelain | sed -n '1s/^worktree //p')"
if [ "$main" = "$PWD" ]; then echo "Das ist der Haupt-Checkout, nichts zu tun."; exit 0; fi
mkdir -p data
if [ ! -f .env.local ] && [ -f "$main/.env.local" ]; then cp "$main/.env.local" .env.local; echo ".env.local kopiert"; fi
if [ -f data/investing.sqlite ]; then echo "data/investing.sqlite ist schon da, bleibt unverändert."; exit 0; fi
# .backup statt cp: konsistent, auch wenn im Haupt-Checkout gerade ein Abgleich schreibt.
sqlite3 "$main/data/investing.sqlite" ".backup data/investing.sqlite"
echo "Datenbank aus $main kopiert"
'''

# --- Image und Betrieb auf dem Proxmox -------------------------------------------
# Das Image baut GitHub bei jedem grünen Push auf main (ci.yml) und legt es als latest auf ghcr.io ab.
# Der LXC holt es per investing-update.timer selbst. Die Tasks hier sind für die Einrichtung und zum Nachsehen.

[tasks."docker:build"]
description = "Image lokal bauen (investing:dev, investing:latest), wie es das CI baut"
run = "./scripts/docker-image.sh"

[tasks."docker:smoke"]
description = "Gebautes Image mit leerer Datenbank starten: /healthz, Seiten (auch Strategie), Worker (IMAGE, VERSION wie beim Bauen)"
run = '''
set -e
image="${IMAGE:-investing}:${VERSION:-dev}"
docker rm -f investing-smoke >/dev/null 2>&1 || true
docker run -d --name investing-smoke -p 3999:3000 "$image" >/dev/null
trap 'docker rm -f investing-smoke >/dev/null' EXIT
docker rm -f investing-smoke-worker >/dev/null 2>&1 || true
docker run -d --name investing-smoke-worker "$image" node scripts/worker.ts >/dev/null
trap 'docker rm -f investing-smoke investing-smoke-worker >/dev/null' EXIT
for _ in $(seq 1 60); do
  if curl -sf localhost:3999/healthz | grep -q "\"version\":\"${VERSION:-dev}\""; then
    curl -sf -o /dev/null localhost:3999/ && curl -sf -o /dev/null localhost:3999/abgleich || { echo "Seiten antworten nicht"; exit 1; }
    # Die Strategie liest docs/*.md zur Laufzeit: fehlt ein Dokument im Image, antworten diese Seiten mit einem Fehler.
    curl -sf -o /dev/null localhost:3999/strategie && curl -sf -o /dev/null localhost:3999/strategie/aenderungen || { echo "Strategie-Seiten antworten nicht (docs im Image?)"; exit 1; }
    docker logs investing-smoke-worker 2>&1 | grep -q "Worker bereit" || { docker logs investing-smoke-worker; exit 1; }
    echo "Rauchtest ok: $image (Oberfläche und Worker)"
    exit 0
  fi
  sleep 1
done
docker logs investing-smoke
exit 1
'''

[tasks."deploy:lxc"]
description = "LXC (Standard 108) auf dem Proxmox anlegen und einrichten (einmalig, über SSH)"
run = '''
set -e
scp -i "$PVE_SSH_KEY" -o IdentitiesOnly=yes deploy/proxmox/create-lxc.sh "$PVE_HOST:/tmp/investing-create-lxc.sh"
ssh -i "$PVE_SSH_KEY" -o IdentitiesOnly=yes "$PVE_HOST" "CTID=$INVESTING_CTID bash /tmp/investing-create-lxc.sh && rm /tmp/investing-create-lxc.sh"
'''

[tasks."deploy:config"]
description = "Betriebsdateien (compose.yaml, Units, Update-Skript) von main neu in den LXC einspielen; sonst macht das der Update-Timer"
run = '''
ssh -i "$PVE_SSH_KEY" -o IdentitiesOnly=yes "$PVE_HOST" "pct exec $INVESTING_CTID -- bash -euc '
  rm -rf /tmp/investing && git clone -q --depth 1 https://github.com/schowave/investing.git /tmp/investing
  bash /tmp/investing/deploy/lxc/install.sh && rm -rf /tmp/investing'"
'''

[tasks."deploy:env"]
description = "Zugangsdaten aus .env.local als /opt/investing/.env in den LXC kopieren und neu starten"
run = '''
set -e
test -f .env.local
ssh_() { ssh -i "$PVE_SSH_KEY" -o IdentitiesOnly=yes "$PVE_HOST" "$@"; }
scp -i "$PVE_SSH_KEY" -o IdentitiesOnly=yes .env.local "$PVE_HOST:/tmp/investing.env"
ssh_ "pct push $INVESTING_CTID /tmp/investing.env /opt/investing/.env --perms 600 && rm /tmp/investing.env \
  && pct exec $INVESTING_CTID -- bash -c 'cd /opt/investing && docker compose up -d --force-recreate investing worker'"
'''

[tasks."deploy:db"]
description = "Lokale Datenbank konsistent kopieren und im LXC einspielen (die dortige bleibt als .vor-import)"
run = '''
set -e
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
sqlite3 "$INVESTING_DB" ".backup $tmp/investing.sqlite"
test "$(sqlite3 "$tmp/investing.sqlite" 'PRAGMA integrity_check')" = ok
echo "Kopie: $(du -h "$tmp/investing.sqlite" | cut -f1)"
opts=(-i "$PVE_SSH_KEY" -o IdentitiesOnly=yes)
scp "${opts[@]}" "$tmp/investing.sqlite" "$PVE_HOST:/tmp/investing-import.sqlite"
scp "${opts[@]}" deploy/proxmox/copy-db.sh "$PVE_HOST:/tmp/investing-copy-db.sh"
ssh "${opts[@]}" "$PVE_HOST" "CTID=$INVESTING_CTID bash /tmp/investing-copy-db.sh /tmp/investing-import.sqlite; s=\$?; rm -f /tmp/investing-import.sqlite /tmp/investing-copy-db.sh; exit \$s"
'''

[tasks."db:pull"]
description = "Datenbank aus dem LXC konsistent nach lokal holen (die lokale bleibt als .vor-pull)"
run = '''
set -e
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
opts=(-i "$PVE_SSH_KEY" -o IdentitiesOnly=yes)
mise run lxc:snapshot pull
ssh "${opts[@]}" "$PVE_HOST" "set -e
  pct pull $INVESTING_CTID /opt/investing/data/investing.sqlite.pull /tmp/investing-pull.sqlite
  pct exec $INVESTING_CTID -- rm -f /opt/investing/data/investing.sqlite.pull"
scp "${opts[@]}" "$PVE_HOST:/tmp/investing-pull.sqlite" "$tmp/investing.sqlite"
ssh "${opts[@]}" "$PVE_HOST" "rm -f /tmp/investing-pull.sqlite"
test "$(sqlite3 "$tmp/investing.sqlite" 'PRAGMA integrity_check')" = ok
if [ -f "$INVESTING_DB" ]; then
  rm -f "$INVESTING_DB.vor-pull"
  sqlite3 "$INVESTING_DB" ".backup $INVESTING_DB.vor-pull"
fi
# .restore über die Backup-API: ersetzt den Inhalt samt WAL, auch wenn die Oberfläche die Datei offen hat.
sqlite3 "$INVESTING_DB" ".restore $tmp/investing.sqlite"
echo "Geholt: $(du -h "$INVESTING_DB" | cut -f1), vorherige lokale Datenbank: $INVESTING_DB.vor-pull"
'''

[tasks."lxc:snapshot"]
description = "Konsistente Kopie der Datenbank im LXC anlegen: /opt/investing/data/investing.sqlite.<name> (vor Schreibzugriffen)"
usage = 'arg "<name>" help="Kleinbuchstaben, Ziffern, Bindestrich, z. B. vor-urteil"'
run = '''
set -e
case "$usage_name" in *[!a-z0-9-]* | "") echo "Name nur aus a-z, 0-9 und -" >&2; exit 1 ;; esac
# Im LXC gibt es kein sqlite3; der Container kopiert mit VACUUM INTO, auch bei laufendem Abgleich konsistent.
ssh -i "$PVE_SSH_KEY" -o IdentitiesOnly=yes "$PVE_HOST" \
  "pct exec $INVESTING_CTID -- bash -c 'cd /opt/investing && docker compose exec -T worker node - /data/investing.sqlite.$usage_name'" <<'JS'
const target = process.argv[2];
require("node:fs").rmSync(target, { force: true });
new (require("node:sqlite").DatabaseSync)("/data/investing.sqlite", { readOnly: true }).prepare("VACUUM INTO ?").run(target);
console.log(`Kopie: ${target} (${(require("node:fs").statSync(target).size / 1e6).toFixed(0)} MB)`);
JS
'''

[tasks."lxc:exec"]
description = "Befehl im Worker-Container des LXC ausführen, Standardeingabe wird durchgereicht (z. B. node scripts/set-input.ts …)"
usage = 'arg "<befehl>..." var=#true help="Befehl mit Argumenten; Argumente mit Leerzeichen per sh -s und Heredoc übergeben"'
run = '''
ssh -i "$PVE_SSH_KEY" -o IdentitiesOnly=yes "$PVE_HOST" \
  "pct exec $INVESTING_CTID -- bash -c 'cd /opt/investing && docker compose exec -T worker $usage_befehl'"
'''

[tasks."deploy:status"]
description = "Stand im LXC: /healthz, Container, Timer, letzte Updates"
run = '''
ssh -i "$PVE_SSH_KEY" -o IdentitiesOnly=yes "$PVE_HOST" "pct exec $INVESTING_CTID -- bash -c '
  curl -s localhost:3000/healthz; echo
  cd /opt/investing && docker compose ps
  grep -oE \"^[A-Z_]+=.\" .env | cut -d= -f1 | xargs echo Gesetzt in .env:
  systemctl list-timers \"investing-*\" --no-pager
  journalctl -u investing-update -u investing-sync -n 20 --no-pager'"
'''
