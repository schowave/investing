# Git-Hooks, eingerichtet von `mise run setup` (lefthook install).
pre-commit:
  # Nacheinander: erst formatieren, dann prüfen, was committet wird.
  piped: true
  commands:
    format:
      glob: "*.{ts,tsx,js,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
      priority: 1
    check:
      run: mise run check
      priority: 2

# Regel-Code nur mit STRATEGIE.md/SPEZIFIKATION.md oder der Zeile „Strategie: ohne Wirkung“ (src/repo/commitDocs.ts).
commit-msg:
  commands:
    strategie:
      run: mise exec -- node scripts/check-commit.ts {1}
